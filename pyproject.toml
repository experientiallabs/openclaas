[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claas"
version = "0.1.0"
description = "CLaaS: Continual Learning as a Service - SDPO-style distillation API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "CLaaS Team" }
]
dependencies = [
    "modal==1.3.3",
    "fastapi==0.141.1",
    "pydantic==2.12.5",
    "httpx==0.28.1",
    "uvicorn==0.41.0",
    "matplotlib==3.10.0",
    "hydra-core==1.3.6",
    "huggingface_hub==0.36.2",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "ty>=0.0.1",
]
teacher = [
    "vllm>=0.15.1",
]
local = [
    "torch>=2.1.0",
    "transformers==4.57.6",
    "peft==0.18.1",
]
tinker = [
    "tinker>=0.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["claas"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "gpu: requires a physical GPU",
    "integration: requires running tinker docker stack",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
exclude-newer = "P7D"
constraint-dependencies = [
    "mcp>=1.30.0",
    "aiohttp>=3.14.5",
    "dnspython>=2.9.2",
    "pillow>=13.0.0",
    "filelock>=4.2.1",
    "msgpack>=1.2.3",
    "certifi>=2026.10.23",
    "pyjwt>=2.15.1",
    "multidict>=6.9.1",
    "urllib3>=2.8.0",
    "cryptography>=50.0.0",
    "hpack>=4.2.0",
    "anyio>=4.14.2",
    "h2>=4.4.1",
    "pydantic-settings>=2.14.2",
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "idna>=3.15",
    "python-dotenv>=1.2.2",
    "pytest>=9.0.3",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "cbor2>=5.9.0",
]
