name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.13.4
          checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra local --extra tinker

      - name: Ruff check
        run: uv run ruff check claas/ tests/

      - name: Ty check
        run: uv run ty check

      - name: Run tests
        run: uv run pytest tests/ -q -m "not integration"

  integration:
    runs-on: ubuntu-latest
    environment: CI
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.13.4
          checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra tinker

      - name: Run integration tests
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          MODEL: meta-llama/Llama-3.2-1B
        run: ./tests/integration/run_tinker_stack_integration.sh

      - name: Dump docker logs on failure
        if: failure()
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: docker compose -f docker/docker-compose.yml --profile tinker logs --tail=200
